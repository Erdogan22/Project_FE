<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TimeSheet{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-body">

<div class="dashboard">

   <aside class="sidebar">
    <div class="sidebar-logo">
        🚀 <span>TimeSheet</span>
    </div>

    <ul class="sidebar-menu">
    <li>
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">
            <i class="bi bi-house"></i> <span>Dashboard</span>
        </a>
    </li>

    <li>
        <a href="/feuille-de-temps"
           class="{% if request.path.startswith('/feuille-de-temps') %}active{% endif %}">
            <i class="bi bi-table"></i> <span>Feuille de temps</span>
        </a>
    </li>
    <!-- to be added -->
     <!-- 
        1️⃣ Mes feuilles de temps

            Right now users can fill a timesheet, but they can’t see past ones.

            Why it’s important

            View previous months

            Edit before validation

            Read-only after approval

            Page ideas

        Month selector

        Status badge: 🟢 Submitted / 🟡 Draft / 🔴 Rejected
     -->
     <li>
        <a href="/mesfeuille-de-temps"
        class="{% if request.path.startswith('/mesfeuille-de-temps') %}active{% endif %}">
            <i class="bi bi-calendar-check"></i>
            <span>Mes feuilles de temps</span>
        </a>
    </li>
    <!-- 
        2️⃣ Statistiques / Résumé

            Users love seeing totals.

            What to show

            Total days worked this month

            Absences

            % charge (worked / total days)
            Dashboard widgets

            Small cards

            Charts later (Chart.js 👌)
     -->
    <li>
        <a href="/stats"
        class="{% if request.path.startswith('/stats') %}active{% endif %}">
            <i class="bi bi-bar-chart"></i>
            <span>Statistiques</span>
        </a>
    </li>

    <!-- 
        ⭐ NICE-TO-HAVE (feels complete)
        3️⃣ Projets

        You already mention it on the homepage — make it real.

        Use cases

        Assign timesheets to projects

        Admin creates projects

        Users select project per row
    -->
         <li>
        <a href="/projects"
            class="{% if request.path.startswith('/projects') %}active{% endif %}">
                <i class="bi bi-briefcase"></i>
                <span>Projets</span>
            </a>
        </li>

        <!-- 
         4️⃣ Profil

            Very expected in enterprise apps.

            Features

            Name / initials (your “JD” avatar 👀)

            Change password

            Language / theme preference
        -->
            <li>
    <a href="/profile"
        class="{% if request.path.startswith('/profile') %}active{% endif %}">
            <i class="bi bi-person-circle"></i>
            <span>Profil</span>
        </a>
    </li>

    <!-- 
        🧠 ADMIN-ONLY (you’re already on this path)
            5️⃣ Validation des feuilles

            This is huge for realism.

            Admin sees

            Pending timesheets

            Approve / Reject

            Comment back to user

            Sidebar (admin only)
    -->
        <li>
            <a href="/admin/approvals"
            class="{% if request.path.startswith('/admin/approvals') %}active{% endif %}">
                <i class="bi bi-check2-square"></i>
                <span>Validations</span>
            </a>
        </li>

        <!-- 
           6️⃣ Exports (PDF / Excel)

            Managers will ask for this immediately 😄

            Features

            Export monthly timesheet

            Export per project

            Export per user
        -->
        <li>
        <a href="/admin/exports"
            class="{% if request.path.startswith('/admin/exports') %}active{% endif %}">
                <i class="bi bi-file-earmark-excel"></i>
                <span>Exports</span>
            </a>
        </li>

            <!-- 
                     7️⃣ Notifications

                     Tiny but powerful.

                    Examples
                    “Your timesheet was approved”

                    “Timesheet due in 2 days”

                    Icon in topbar or sidebar:
                -->
                   



    {% if current_user.role == 'admin' %}
    <li>
        <a href="/admin/users"
           class="{% if request.path.startswith('/admin') %}active{% endif %}">
            <i class="bi bi-people"></i> <span>Utilisateurs</span>
        </a>
    </li>
    {% endif %}

    <li class="logout">
        <a href="/logout">
            <i class="bi bi-box-arrow-right"></i> <span>Déconnexion</span>
        </a>
    </li>
</ul>

</aside>


    <!-- MAIN -->
    <div class="main">

        <!-- TOP BAR -->
        <header class="topbar">
            <!-- Mobile hamburger -->
            <button class="btn btn-light d-lg-none" id="sidebarToggle" title="Ouvrir le menu">
                <i class="bi bi-list"></i>
            </button>

            <!-- Desktop collapse -->
            <!-- <button class="btn btn-light d-none d-lg-inline" id="collapseSidebar" title="Réduire le menu">
                <i class="bi bi-layout-sidebar"></i>
            </button> -->

            <!-- Search -->
            <input class="search d-none d-md-block" type="text" placeholder="Rechercher…">

        <div class="topbar-actions">

            <!-- Notifications -->
            <button class="btn btn-light position-relative" title="Notifications">
                <i class="bi bi-bell"></i>

                <!-- Notification badge -->
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                    3
                </span>
            </button>

            <!-- Dark mode -->
            <button class="btn btn-light" id="darkModeToggle" title="Mode sombre">
                <i class="bi bi-moon"></i>
            </button>

            <!-- User avatar -->
            <div class="user-avatar">JD</div>
</div>

        </header>

        <!-- PAGE CONTENT -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const sidebar = document.querySelector(".sidebar");
    const mobileToggle = document.getElementById("sidebarToggle");
    const collapseBtn = document.getElementById("collapseSidebar");
    const darkToggle = document.getElementById("darkModeToggle");

    if (!sidebar) return;

    // ---------------- MOBILE SIDEBAR TOGGLE ----------------
    mobileToggle?.addEventListener("click", function () {
        sidebar.classList.toggle("open");
    });

    // Close sidebar when clicking outside (mobile)
    document.addEventListener("click", function (e) {
        if (
            window.innerWidth < 992 &&
            sidebar.classList.contains("open") &&
            !sidebar.contains(e.target) &&
            !mobileToggle.contains(e.target)
        ) {
            sidebar.classList.remove("open");
        }
    });

    // ---------------- DESKTOP COLLAPSE ----------------
//    collapseBtn?.addEventListener("click", function () {
//     sidebar.classList.toggle("collapsed");
//     localStorage.setItem(
//         "sidebar-collapsed",
//         sidebar.classList.contains("collapsed")
//     );
// });

//     // Restore sidebar collapse state
//     if (localStorage.getItem("sidebar-collapsed") === "true") {
//         sidebar.classList.add("collapsed");
//     }

    // ---------------- DARK MODE ----------------
    darkToggle?.addEventListener("click", function () {
        document.body.classList.toggle("dark");
        localStorage.setItem(
            "dark-mode",
            document.body.classList.contains("dark")
        );
    });

    if (localStorage.getItem("dark-mode") === "true") {
        document.body.classList.add("dark");
    }

    // ---------------- RESIZE HANDLER ----------------
    window.addEventListener("resize", function () {
        if (window.innerWidth >= 992) {
            sidebar.classList.remove("open"); // remove mobile open
        }
    });
});
</script>



</body>
</html>
