{% extends "base.html" %}
{% block title %}Gestion des feuilles de temps{% endblock %}

{% block content %}
<div class="container mt-4">
  <h4 class="mb-4">📄 Feuilles de temps - Employés</h4>

  <div class="list-group shadow-sm">
    {% for user in users %}
      <a href="{{ url_for('admin.admin_timesheet', user_id=user.id) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <div>
          <strong>{{ user.nom }} {{ user.prenom }}</strong><br>
          <small class="text-muted">{{ user.email }}</small>
        </div>
        <span class="badge bg-primary">Ouvrir</span>
      </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
