{% extends "base.html" %}

{% block title %}Changer mot de passe{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow" style="max-width: 600px; margin: 0 auto;">
        <div class="card-body">
            <h4 class="card-title mb-4">Changer le mot de passe</h4>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="mb-3">
                  {% for message in messages %}
                    <div class="alert alert-success" role="alert">{{ message }}</div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label for="password" class="form-label">Nouveau mot de passe</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Entrez votre nouveau mot de passe" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-compact">Valider</button>
                    <a href="/user/profile" class="btn btn-secondary btn-compact">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
